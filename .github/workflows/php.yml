name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}

    - name: Run install-dependencies.sh
      run: bash installscript/install-dependencies.sh

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    # Bricht bei bekannten Sicherheitsluecken in den Laufzeit-Abhaengigkeiten
    # ab; aufgegebene Pakete werden nur gemeldet. require-dev laeuft nur hier
    # und lokal, dessen Aktualisierung kommt ueber Dependabot.
    - name: Audit dependencies
      run: composer audit --no-dev --abandoned=report

    - name: Dump Autoload
      run: composer dump-autoload -o

    - name: Copy phpunit.xml
      run: php -r "file_exists('phpunit.xml') || copy('phpunit.xml.dist', 'phpunit.xml');"

    - name: Check code style (Pint)
      run: composer run-script format

    - name: Static analysis (PHPStan)
      run: composer run-script lint

    - name: Run test suite
      run: composer run-script test
